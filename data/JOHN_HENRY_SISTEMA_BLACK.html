<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOHN HENRY — Sistema de Marca · Black</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Cinzel:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F0E0C;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 60px 80px;
    }
    .variant-label {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.45em;
      color: rgba(232, 208, 144, 0.45);
      text-transform: uppercase;
      margin-bottom: 56px;
    }
    .container {
      display: flex;
      gap: 0;
      align-items: flex-start;
    }
    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 64px;
    }
    .mark-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 220px;
      height: 280px;
    }
    .section-label {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.4em;
      color: rgba(232, 208, 144, 0.5);
      text-transform: uppercase;
      margin-top: 32px;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 26px;
      letter-spacing: 0.28em;
      color: #E8D090;
      text-transform: uppercase;
      display: block;
      text-align: center;
      white-space: nowrap;
    }
    .brand-sub {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 0.38em;
      color: #E8D090;
      text-transform: uppercase;
      display: block;
      margin-top: 12px;
      text-align: center;
      white-space: nowrap;
    }
    .divider {
      width: 1px;
      height: 320px;
      background: rgba(232, 208, 144, 0.15);
      align-self: center;
    }
    .imagotipo-text {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="variant-label">Variante · Negro Profundo · #0F0E0C</div>

  <div class="container">

    <!-- ISOTIPO -->
    <div class="section">
      <div class="mark-container">
        <svg viewBox="0 0 100 115" width="130" height="150" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="31" y1="10" x2="31" y2="80" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <line x1="69" y1="10" x2="69" y2="80" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <line x1="31" y1="48" x2="69" y2="48" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <line x1="22" y1="10" x2="40" y2="10" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <line x1="60" y1="10" x2="78" y2="10" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <path d="M 31,76 C 31,92 22,100 13,100 C 8,100 6,96 6,92" stroke="#E8D090" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M 69,76 C 69,92 78,100 87,100 C 92,100 94,96 94,92" stroke="#E8D090" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <span class="section-label">Isotipo</span>
    </div>

    <div class="divider"></div>

    <!-- LOGOTIPO -->
    <div class="section">
      <div class="mark-container" style="justify-content: center; gap: 0;">
        <span class="brand-name">John Henry</span>
        <span class="brand-sub">Sastrería &nbsp;·&nbsp; Est. 2004</span>
      </div>
      <span class="section-label">Logotipo</span>
    </div>

    <div class="divider"></div>

    <!-- IMAGOTIPO -->
    <div class="section">
      <div class="mark-container" style="justify-content: center; gap: 0;">
        <svg viewBox="0 0 100 115" width="88" height="101" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="31" y1="10" x2="31" y2="80" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <line x1="69" y1="10" x2="69" y2="80" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <line x1="31" y1="48" x2="69" y2="48" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <line x1="22" y1="10" x2="40" y2="10" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <line x1="60" y1="10" x2="78" y2="10" stroke="#E8D090" stroke-width="2.8" stroke-linecap="square"/>
          <path d="M 31,76 C 31,92 22,100 13,100 C 8,100 6,96 6,92" stroke="#E8D090" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M 69,76 C 69,92 78,100 87,100 C 92,100 94,96 94,92" stroke="#E8D090" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <div class="imagotipo-text">
          <span class="brand-name" style="font-size: 20px; letter-spacing: 0.25em;">John Henry</span>
          <span class="brand-sub">Sastrería &nbsp;·&nbsp; Est. 2004</span>
        </div>
      </div>
      <span class="section-label">Imagotipo</span>
    </div>

  </div>

</body>
</html>
